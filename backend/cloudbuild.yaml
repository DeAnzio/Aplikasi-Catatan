steps:
  - name: gcr.io/cloud-builders/docker
    dir: backend
    args:
      - build
      - -t
      - gcr.io/$PROJECT_ID/notes-backend:$COMMIT_SHA
      - .

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - gcr.io/$PROJECT_ID/notes-backend:$COMMIT_SHA

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    args:
      - gcloud
      - run
      - deploy
      - notes-backend
      - --image
      - gcr.io/$PROJECT_ID/notes-backend:$COMMIT_SHA
      - --region
      - ${_REGION}
      - --platform
      - managed
      - --allow-unauthenticated
      - --set-env-vars
      - DB_HOST=${_DB_HOST},DB_PORT=${_DB_PORT},DB_USER=${_DB_USER},DB_PASS=${_DB_PASS},DB_NAME=${_DB_NAME},FRONTEND_URL=${_FRONTEND_URL}

images:
  - gcr.io/$PROJECT_ID/notes-backend:$COMMIT_SHA

substitutions:
  _REGION: asia-southeast2
  _DB_HOST: 34.172.113.167
  _DB_PORT: "3306"
  _DB_USER: admin
  _DB_PASS: isi_password_di_cloud_build_trigger
  _DB_NAME: notes_NIM
  _FRONTEND_URL: http://localhost

options:
  logging: CLOUD_LOGGING_ONLY
